# BESS Agent application configuration
# Sensitive information should be read from environment variables, use ${ENV_VAR} format

agent:
  name: bess-alarm-agent
  version: 1.0.0
  log_level: INFO
  log_file: logs/agent.log
  max_workers: 4
  
  # Data flow configuration
  data_flow:
    # Deduplication configuration
    deduplication:
      enabled: true
      window_seconds: 5  # Time window for deduplication (seconds)
      cleanup_interval_seconds: 60  # Cleanup old keys interval
    
    # Data source priority (higher number = higher priority)
    # When same data arrives from multiple sources, higher priority source wins
    source_priority:
      mqtt: 1  # Highest priority (real-time)
      integration_service: 2  # Medium priority (periodic collection)
      webhook: 3  # Lower priority (alert-triggered)
    
    # InfluxDB buffer flush configuration
    influxdb_flush:
      interval_seconds: 10  # Periodic flush interval
      enable_periodic_flush: true  # Enable periodic flush to prevent data loss
    
    # Device status check configuration
    device_status_check:
      enabled: true  # Check device status before processing data
      # Note: Unregistered devices are always rejected (must be registered first)
      reject_inactive_devices: false  # If true, reject data from INACTIVE devices
                                      # If false, auto-recover INACTIVE devices when data received

# Data collection service configuration
data_collection:
  collection_interval: 30.0  # Interval for data collection (seconds)
  use_agent_service: true  # Route data through AgentService (recommended)
  
  # Fast failure detection for offline devices
  fast_failure_detection:
    enabled: true  # Enable fast failure detection
    max_consecutive_failures: 3  # Mark device as inactive after N consecutive failures
  
  # Inactive device retry configuration
  inactive_device_retry:
    enabled: true  # Enable retry for inactive devices
    retry_interval: 300.0  # Retry interval for inactive devices (seconds, default: 5 minutes)

# Database configuration
database:
  # InfluxDB configuration (time series data)
  influxdb:
    url: http://localhost:8086
    token: ${INFLUXDB_TOKEN}
    org: bess
    bucket: alarms
    timeout: 30
    # Site container mode: each site has its own bucket for data isolation
    # When enabled, data is stored in site-specific buckets (site_{site_id})
    # When disabled, data is stored in shared bucket with site_id tags (legacy mode)
    enable_site_containers: ${ENABLE_SITE_CONTAINERS:-true}  # Default: true (enabled)
    container_name_pattern: "site_{site_id}"  # Bucket naming pattern

  # PostgreSQL configuration (relational data)
  postgresql:
    host: localhost
    port: 5432
    database: bess_agent
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    pool_size: 10
    max_overflow: 20

  # Redis configuration (cache)
  # Use REDIS_HOST environment variable to override (e.g., "redis" for Docker, "localhost" for local)
  redis:
    host: ${REDIS_HOST:-localhost}  # Use service name "redis" when running in Docker
    port: ${REDIS_PORT:-6379}
    password: ${REDIS_PASSWORD:-changeme}  # Default password matches docker-compose.yml
    db: ${REDIS_DB:-0}
    decode_responses: true

# LLM configuration
# Supported providers: openai, ollama, anthropic, google, groq, huggingface, together
llm:
  # DISABLED: Comment out provider to disable LLM diagnostic service and save tokens
  # provider: groq # Recommended for MVP: groq (free), production: openai
  # provider: null  # Disabled to prevent token consumption
  provider: ollama  # 使用远程 Ollama 实例
  # Ollama remote LLM configuration
  ollama_url: http://10.0.0.228:11434
  ollama_model: qwen2.5:7b
  # API key (Ollama 通常不需要，但可以设置为 "ollama" 或留空)
  api_key: ollama
  # Auto-diagnostic: Set to true to automatically generate diagnostics when alarms are created
  # Default: false (disabled) - Use manual trigger API endpoints instead to save tokens:
  #   - POST /api/v1/sites/{site_id}/diagnostics/generate (site-level diagnosis with all devices and history)
  #   - POST /api/v1/alarms/{alarm_id}/diagnostic (single alarm diagnosis)
  auto_diagnostic: false  # Set to true to enable automatic diagnosis (not recommended to save tokens)
  # OpenAI configuration
  # api_key: ${OPENAI_API_KEY}
  # model: gpt-4  # or gpt-3.5-turbo
  # Groq API configuration (free, recommended for MVP)
  # api_key: ${GROQ_API_KEY}
  # model: llama-3.1-8b-instant # or llama-3.1-70b-versatile, mixtral-8x7b-32768, gemma-7b-it
  # Google Gemini configuration (free quota)
  # api_key: ${GOOGLE_API_KEY}
  # model: gemini-pro
  # Hugging Face configuration (free quota)
  # api_key: ${HUGGINGFACE_API_KEY}
  # model: meta-llama/Llama-2-7b-chat-hf
  # General configuration
  temperature: 0.3
  max_tokens: 2000
  timeout: 50
  retry_times: 3
  retry_delay: 1
  cache_ttl: 3600 # Cache time (seconds)

# Grafana configuration
grafana:
  url: http://localhost:3000
  api_key: ${GRAFANA_API_KEY}
  org_id: 1
  timeout: 30

# Email configuration
# SMTP settings for sending verification codes and alarm notifications
# Configure these values in your .env file:
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD
#   SMTP_USE_TLS, SMTP_USE_SSL, FROM_ADDRESS, FROM_NAME
email:
  smtp_host: ${SMTP_HOST:-smtp.example.com}
  smtp_port: ${SMTP_PORT:-587}
  smtp_user: ${SMTP_USER}
  smtp_password: ${SMTP_PASSWORD}
  smtp_use_tls: ${SMTP_USE_TLS:-true}
  smtp_use_ssl: ${SMTP_USE_SSL:-false}
  from_address: ${FROM_ADDRESS:-agent@example.com}
  from_name: ${FROM_NAME:-BESS Agent}
  to_addresses:
    - engineer1@example.com
    - engineer2@example.com
  cc_addresses: []
  subject_template: "⚠️ BESS Alert – {alarm_type} ({severity})"

# Data collector configuration
collector:
  # BMS data collection
  bms:
    enabled: true
    interval: 30 # Collection interval (seconds)
    timeout: 10
    api_url: ${BMS_API_URL}
    api_key: ${BMS_API_KEY}

  # PCS data collection
  pcs:
    enabled: true
    interval: 30
    timeout: 10
    api_url: ${PCS_API_URL}
    api_key: ${PCS_API_KEY}

  # EMS data collection
  ems:
    enabled: true
    interval: 60
    timeout: 10
    api_url: ${EMS_API_URL}
    api_key: ${EMS_API_KEY}

  # Log parsing
  log:
    enabled: true
    log_path: /var/log/bess
    patterns:
      - "*.log"
      - "*.txt"
    parse_interval: 60

# Webhook configuration
webhook:
  host: 0.0.0.0
  port: 8000
  workers: 4
  timeout: 30
  max_request_size: 10485760 # 10MB

# Rule engine configuration
rule_engine:
  rules_file: config/rules_universal.yaml
  site_rules_dir: config/sites  # Directory for site-specific rules
  enable_multi_site: ${ENABLE_MULTI_SITE:-false}  # Enable multi-site support
  cache_enabled: true
  cache_ttl: 300

# Diagnostic service configuration
diagnostic:
  enable_cache: true
  cache_ttl: 3600
  max_history_days: 7
  prompt_templates_dir: prompts
