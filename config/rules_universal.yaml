      - trigger_llm_diagnostic
      - send_email
      - notify_engineer
    metadata:
      sop_reference: "SOP 16.1.1"
      alarm_type: site_total_power_limit_exceeded
      site_level: true

  # Rule SITE_002: Site energy consumption high
