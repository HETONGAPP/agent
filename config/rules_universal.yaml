  # Rule HTS_005: High temperature
  - id: RULE_HTS_005
    name: HTS High Temperature
    description: Detect high temperature
    device_types: [HTS]
    condition:
      type: threshold
      field: temperature
      operator: ">"
      value: 60
      unit: "°C"
    severity: Critical
    priority: 9
