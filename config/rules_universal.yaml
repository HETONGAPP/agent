    severity: Critical
    priority: 9
    actions:
      - trigger_llm_diagnostic
      - send_email
      - notify_engineer
    metadata:
      sop_reference: "SOP 8.1.1"
      alarm_type: grid_connection_issue

  # Rule PCS_008: PCS operating state fault
  - id: RULE_PCS_008
    name: PCS Operating State Fault
    description: Detect PCS in fault operating state
    device_types: [PCS]
    condition:
      type: status
      field: operating_state
      operator: "=="
      value: "fault"
    severity: Critical
    priority: 10
    actions:
      - trigger_llm_diagnostic
      - send_email
      - notify_engineer
    metadata:
      sop_reference: "SOP 6.4.2"
      alarm_type: pcs_operating_state_fault

  # Rule PCS_009: Frequency out of range
  - id: RULE_PCS_009
    name: PCS Frequency Out of Range
    description: Detect AC frequency out of acceptable range
    device_types: [PCS]
    condition:
      type: range
      field: frequency
      operator: "outside"
      min_value: 49.5
      max_value: 50.5
      unit: "Hz"
    severity: Warning
    priority: 7
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 6.7.1"
      alarm_type: frequency_out_of_range

  # Rule PCS_010: High temperature
  - id: RULE_PCS_010
    name: PCS High Temperature
    description: Detect high temperature
    device_types: [PCS]
    condition:
      type: threshold
      field: temperature
      operator: ">"
      value: 60
      unit: "°C"
    severity: Critical
    priority: 9
    actions:
      - trigger_llm_diagnostic
      - send_email
      - notify_engineer
    metadata:
      sop_reference: "SOP 4.1.4"
      alarm_type: pcs_high_temperature

  # Rule PCS_011: Ambient temperature extreme
