# Universal Rules Configuration
# Extracted from EMS project and adapted for agent project
# Supports all energy storage system components
# Organized by device type, then site-level rules

rules:
  # ============================================
  # BMS (Battery Management System) Rules
  # ============================================
  
  # Rule BMS_001: Cell voltage deviation
  - id: RULE_BMS_001
    name: BMS Cell Voltage Deviation
    description: Detect cell voltage deviation, trigger when maximum voltage difference exceeds threshold
    device_types: [BMS]
    condition:
      type: threshold
      field: max_delta_v
      operator: ">="
      value: 0.08
      unit: "V"
    severity: Warning
    priority: 5
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 3.2.1"
      standard: "UL 9540A"
      alarm_type: cell_voltage_deviation

  # Rule BMS_002: Over temperature alarm
  - id: RULE_BMS_002
    name: BMS Over Temperature
    description: Detect over temperature alarm, trigger when maximum temperature exceeds threshold
    device_types: [BMS]
    condition:
      type: threshold
      field: max_temperature
      operator: ">"
      value: 43
      unit: "°C"
    severity: Critical
    priority: 10
    actions:
      - trigger_llm_diagnostic
      - send_email
      - notify_engineer
    metadata:
      sop_reference: "SOP 4.1.2"
      standard: "IEC 62619"
      alarm_type: over_temperature

  # Rule BMS_003: Under temperature alarm
  - id: RULE_BMS_003
    name: BMS Under Temperature
    description: Detect under temperature alarm, trigger when minimum temperature is below threshold
    device_types: [BMS]
    condition:
      type: threshold
      field: min_temperature
      operator: "<"
      value: 0
      unit: "°C"
    severity: Warning
    priority: 6
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 4.1.3"
      alarm_type: under_temperature

  # Rule BMS_004: SOC anomaly (rate of change)
  - id: RULE_BMS_004
    name: BMS SOC Anomaly
    description: Detect SOC rate of change anomaly
    device_types: [BMS]
    condition:
      type: rate_of_change
      field: soc
      operator: ">"
      value: 10
      unit: "%/min"
      time_window: 60
      unit_time: "seconds"
    severity: Warning
    priority: 4
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 2.3.1"
      alarm_type: soc_anomaly

  # Rule BMS_005: SOC low
  - id: RULE_BMS_005
    name: BMS SOC Low
    description: Detect low state of charge
    device_types: [BMS]
    condition:
      type: threshold
      field: soc
      operator: "<"
      value: 10
      unit: "%"
    severity: Warning
    priority: 7
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 2.1.1"
      alarm_type: soc_low

  # Rule BMS_006: SOC high
  - id: RULE_BMS_006
    name: BMS SOC High
    description: Detect high state of charge
    device_types: [BMS]
    condition:
      type: threshold
      field: soc
      operator: ">"
      value: 95
      unit: "%"
    severity: Warning
    priority: 5
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 2.1.2"
      alarm_type: soc_high

  # Rule BMS_007: SOH degradation
  - id: RULE_BMS_007
    name: BMS SOH Degradation
    description: Detect battery health state degradation
    device_types: [BMS]
    condition:
      type: threshold
      field: soh
      operator: "<"
      value: 80
      unit: "%"
    severity: Warning
    priority: 7
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 5.1.1"
      alarm_type: soh_degradation

  # Rule BMS_008: Rapid SOH degradation
  - id: RULE_BMS_008
    name: BMS Rapid SOH Degradation
    description: Detect rapid battery health degradation (rate of change)
    device_types: [BMS]
    condition:
      type: rate_of_change
      field: soh
      operator: "<"
      value: -2
      unit: "%/month"
      time_window: 2592000
      unit_time: "seconds"
    severity: Warning
    priority: 8
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 5.2.1"
      standard: "IEC 62619"
      alarm_type: rapid_soh_degradation

  # Rule BMS_009: Module imbalance
  - id: RULE_BMS_009
    name: BMS Module Imbalance
    description: Detect module imbalance
    device_types: [BMS]
    condition:
      type: threshold
      field: module_voltage_diff
      operator: ">="
      value: 5
      unit: "V"
    severity: Warning
    priority: 5
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 3.3.1"
      alarm_type: module_imbalance

  # Rule BMS_010: Battery pack imbalance
  - id: RULE_BMS_010
    name: BMS Battery Pack Imbalance
    description: Detect significant imbalance between battery packs
    device_types: [BMS]
    condition:
      type: threshold
      field: pack_voltage_diff
      operator: ">="
      value: 10
      unit: "V"
    severity: Warning
    priority: 6
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 3.4.1"
      alarm_type: pack_imbalance

  # Rule BMS_011: BMS fault status
  - id: RULE_BMS_011
    name: BMS Fault Status
    description: Detect BMS fault status
    device_types: [BMS]
    condition:
      type: status
      field: status
      operator: "=="
      value: "fault"
    severity: Critical
    priority: 10
    actions:
      - trigger_llm_diagnostic
      - send_email
      - notify_engineer
    metadata:
      sop_reference: "SOP 1.1.1"
      alarm_type: bms_fault

  # Rule BMS_012: BMS warning status
  - id: RULE_BMS_012
    name: BMS Warning Status
    description: Detect BMS warning status
    device_types: [BMS]
    condition:
      type: status
      field: status
      operator: "=="
      value: "warning"
    severity: Warning
    priority: 6
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 1.1.2"
      alarm_type: bms_warning

  # Rule BMS_013: Charge forbidden
  - id: RULE_BMS_013
    name: BMS Charge Forbidden
    description: Detect when charging is forbidden
    device_types: [BMS]
    condition:
      type: status
      field: charge_forbidden
      operator: "=="
      value: true
    severity: Warning
    priority: 7
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 2.2.1"
      alarm_type: charge_forbidden

  # Rule BMS_014: Discharge forbidden
  - id: RULE_BMS_014
    name: BMS Discharge Forbidden
    description: Detect when discharging is forbidden
    device_types: [BMS]
    condition:
      type: status
      field: discharge_forbidden
      operator: "=="
      value: true
    severity: Warning
    priority: 7
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 2.2.2"
      alarm_type: discharge_forbidden

  # Rule BMS_015: Current limit exceeded
  - id: RULE_BMS_015
    name: BMS Current Limit Exceeded
    description: Detect when current exceeds maximum allowed
    device_types: [BMS]
    condition:
      type: threshold
      field: current
      operator: ">"
      value: 100
      unit: "A"
    severity: Critical
    priority: 9
    actions:
      - trigger_llm_diagnostic
      - send_email
      - notify_engineer
    metadata:
      sop_reference: "SOP 6.1.1"
      alarm_type: current_limit_exceeded

  # Rule BMS_016: High temperature
  - id: RULE_BMS_016
    name: BMS High Temperature
    description: Detect high temperature
    device_types: [BMS]
    condition:
      type: threshold
      field: temperature
      operator: ">"
      value: 60
      unit: "°C"
    severity: Critical
    priority: 9
    actions:
      - trigger_llm_diagnostic
      - send_email
      - notify_engineer
    metadata:
      sop_reference: "SOP 4.1.4"
      alarm_type: bms_high_temperature

  # Rule BMS_017: Ambient temperature extreme
  - id: RULE_BMS_017
    name: BMS Ambient Temperature Extreme
    description: Detect extreme ambient temperature affecting system
    device_types: [BMS]
    condition:
      type: range
      field: ambient_temperature
      operator: "outside"
      min_value: -10
      max_value: 45
      unit: "°C"
    severity: Warning
    priority: 7
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 4.5.1"
      alarm_type: bms_ambient_temperature_extreme

  # Rule BMS_018: Charge/discharge efficiency anomaly
  - id: RULE_BMS_018
    name: BMS Charge/Discharge Efficiency Anomaly
    description: Detect abnormal charge/discharge efficiency
    device_types: [BMS]
    condition:
      type: threshold
      field: charge_discharge_efficiency
      operator: "<"
      value: 85
      unit: "%"
    severity: Warning
    priority: 6
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 2.4.1"
      alarm_type: bms_efficiency_anomaly

  # ============================================
