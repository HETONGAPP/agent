  # Rule HTS_001: HTS temperature high
  - id: RULE_HTS_001
    name: HTS Temperature High
    description: Detect sensor temperature above threshold
    device_types: [HTS]
    condition:
      type: threshold
      field: temperature
      operator: ">"
      value: 40
      unit: "°C"
    severity: Warning
    priority: 6
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 12.1.1"
      alarm_type: hts_temperature_high

  # Rule HTS_002: HTS temperature low
  - id: RULE_HTS_002
    name: HTS Temperature Low
    description: Detect HTS temperature below threshold
    device_types: [HTS]
    condition:
      type: threshold
      field: temperature
      operator: "<"
      value: -10
      unit: "°C"
    severity: Warning
    priority: 6
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 12.1.2"
      alarm_type: hts_temperature_low

  # Rule HTS_003: HTS humidity high
  - id: RULE_HTS_003
    name: HTS Humidity High
    description: Detect HTS humidity above threshold
    device_types: [HTS]
    condition:
      type: threshold
      field: humidity
      operator: ">"
      value: 80
      unit: "%"
    severity: Warning
    priority: 5
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 12.2.1"
      alarm_type: hts_humidity_high

  # Rule HTS_004: HTS communication failure
  - id: RULE_HTS_004
    name: HTS Communication Failure
    description: Detect HTS communication failure
    device_types: [HTS]
    condition:
      type: status
      field: communication_status
      operator: "=="
      value: "failed"
