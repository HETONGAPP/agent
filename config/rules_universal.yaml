  # ============================================
  # Site-Level Rules (applies to entire site/system)
  # ============================================
  
  # Rule SITE_001: Site total power limit exceeded
  - id: RULE_SITE_001
    name: Site Total Power Limit Exceeded
    description: Detect when total site power exceeds limit
    device_types: [EMS]
    condition:
      type: threshold
      field: total_power
      operator: ">"
      value: 5000
      unit: "kW"
    severity: Critical
    priority: 9
