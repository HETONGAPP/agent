  # Rule HTS_006: Ambient temperature extreme
  - id: RULE_HTS_006
    name: HTS Ambient Temperature Extreme
    description: Detect extreme ambient temperature affecting system
    device_types: [HTS]
    condition:
      type: range
      field: ambient_temperature
      operator: "outside"
      min_value: -10
      max_value: 45
      unit: "°C"
    severity: Warning
    priority: 7
    actions:
      - trigger_llm_diagnostic
      - send_email
    metadata:
      sop_reference: "SOP 4.5.1"
      alarm_type: hts_ambient_temperature_extreme

